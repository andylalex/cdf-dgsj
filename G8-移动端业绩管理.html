    </div>

        </div>
        <p class="text-2xl font-bold mt-1" id="sumCounted">¥0</p>
        <div class="flex justify-between mt-3 text-xs opacity-90">
          <span>待结算 <span id="sumPending" class="font-medium">¥0</span></span>
          <span>共 <span id="sumCount" class="font-medium">0</span> 笔</span>
        </div>
      </div>
    </div>

    <!-- 筛选 -->
    <div class="px-3 py-3 bg-white border-b border-gray-100 shrink-0 space-y-3">
      <div class="relative">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input id="fSearch" type="text" placeholder="搜索订单号 / 客户名称 / 手机号" class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-8 pr-3 py-2 text-xs text-gray-700 outline-none">
      </div>
      <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar">

        <button data-status="待支付" onclick="setStatus('待支付')" class="status-pill px-3 py-1.5 bg-white border border-gray-200 text-gray-600 text-xs font-medium rounded-full whitespace-nowrap">待支付</button>
        <button data-status="待发货" onclick="setStatus('待发货')" class="status-pill px-3 py-1.5 bg-white border border-gray-200 text-gray-600 text-xs font-medium rounded-full whitespace-nowrap">待发货</button>

    ORDERS.forEach(o => orderMap[o.no] = o);

    // 列表「我的业绩」：作为卡片主视觉——大号金额 + 状态徽标（已计入/未完结/退款不计入/含退款不计入）
    function perfMyCell(o) {
      const isCompleted = o.status.text === '已完成';
      const myPs = o.products.filter(p => p.guide === ME);
      if (myPs.length === 0) return '<p class="text-xl font-bold text-gray-300 leading-none mt-0.5">—</p>';
      let amt, color, chip = '', chipCls = '';
      if (isCompleted) {
        const counted = myPs.filter(p => p.refund === 'none').reduce((s, p) => s + p.price, 0);
        const hasRefund = myPs.some(p => p.refund !== 'none');
        const total = myPs.reduce((s, p) => s + p.price, 0);
        if (counted > 0) {
          amt = fmt(counted); color = 'text-coral-600';
          chip = hasRefund ? '含退款不计入' : '已计入';
          chipCls = hasRefund ? 'bg-gray-100 text-gray-400' : 'bg-green-100 text-green-600';
        } else {
          amt = fmt(total); color = 'text-gray-400 line-through';
          chip = '退款不计入'; chipCls = 'bg-gray-100 text-gray-400';
        }
      } else {
        amt = fmt(myPs.reduce((s, p) => s + p.price, 0)); color = 'text-gray-500';
        chip = '未完结'; chipCls = 'bg-gray-100 text-gray-400';
      }
      return '<div class="flex items-center gap-1.5 mt-0.5">' +
        '<span class="text-xl font-bold ' + color + ' leading-none">' + amt + '</span>' +
        '<span class="px-1.5 py-0.5 ' + chipCls + ' text-[10px] rounded">' + chip + '</span>' +
      '</div>';
    }

    // 详情：单个商品行（结构化展示，避免一长串拼接文字）
    function productRow(p, isCompleted) {
      const mine = p.guide === ME;
      let sub = p.store + ' · ' + p.group;
      let amtCls = 'text-gray-400', badgeT = '', badgeC = 'bg-gray-100 text-gray-400';
      if (isCompleted) {
        if (p.refund === 'none') {
          amtCls = mine ? 'text-coral-600' : 'text-gray-400';
          badgeT = mine ? '计入' : '同事业绩';
          badgeC = mine ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400';
        } else { badgeT = '退款不计入'; }
      } else { badgeT = '未完结'; }
      if (!mine) { sub += ' · ' + p.guide + '（同事）'; if (p.refund !== 'none') badgeT = '退款不计入 · 同事业绩'; }
      return '' +
        '<div class="flex items-start gap-3 bg-gray-50 rounded-xl p-3">' +
          '<div class="w-14 h-14 rounded-lg bg-coral-50 flex items-center justify-center text-coral-600 shrink-0"><i class="fas ' + p.icon + ' text-lg"></i></div>' +
          '<div class="flex-1 min-w-0">' +
            '<p class="font-medium text-gray-800 text-sm">' + p.name + '</p>' +
            '<p class="text-xs text-gray-500 mt-1">规格：' + p.spec + ' · 数量：×' + p.qty + '</p>' +
            '<p class="text-[11px] text-gray-400 mt-1">' + sub + '</p>' +
            (p.wh && p.wh.length ?
              '<div class="mt-1.5">' +
                '<div class="flex items-center gap-1.5 text-[11px] text-gray-500">' +
                  '<i class="fas fa-warehouse"></i><span>出货仓库</span>' +
                '</div>' +
                '<div class="mt-1 space-y-1">' +
                  p.wh.map(w =>
                    '<div class="flex items-center justify-between gap-2 bg-coral-50 text-coral-600 rounded-md px-2 py-1">' +
                      '<span class="text-[11px] truncate">'+w.name+'</span>' +
                      '<b class="text-[11px] font-bold shrink-0">×'+w.qty+'</b>' +
                    '</div>'
                  ).join('') +
                '</div>' +
              '</div>'
            : '') +
          '</div>' +
          '<div class="text-right shrink-0">' +
            '<p class="font-bold ' + amtCls + ' text-sm">' + fmt(p.price) + '</p>' +
            '<span class="inline-block mt-1 px-1.5 py-0.5 ' + badgeC + ' text-[10px] rounded">' + badgeT + '</span>' +
          '</div>' +
        '</div>';
    }

    // 我的业绩（计入）：本订单中 guide===ME 且 已完成且未退款 的商品金额
    function myCounted(o) {
      if (o.status.text !== '已完成') return 0;
      return o.products.filter(p => p.guide === ME && p.refund === 'none').reduce((s, p) => s + p.price, 0);
    }
    // 待结算：未完成订单中 guide===ME 的商品金额合计
    function myPending(o) {
      if (o.status.text === '已完成') return 0;
      return o.products.filter(p => p.guide === ME).reduce((s, p) => s + p.price, 0);
    }

    let currentStatus = 'all';

    function getFiltered() {
      const kw = (document.getElementById('fSearch').value || '').trim().toLowerCase();
      const df = document.getElementById('fDateFrom').value;
      const dt = document.getElementById('fDateTo').value;
      return ORDERS.filter(o => {
        if (currentStatus !== 'all' && o.status.text !== currentStatus) return false;
        if (df && o.time.slice(0, 10) < df) return false;
        if (dt && o.time.slice(0, 10) > dt) return false;
        if (kw) {
          const hay = (o.no + ' ' + o.user + ' ' + o.phone).toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });
    }

    function renderList(list) {
      const box = document.getElementById('orderList');
      if (list.length === 0) { box.innerHTML = '<p class="text-center text-xs text-gray-400 py-8">暂无符合条件的订单</p>'; return; }
      const grpShort = g => g.replace(/（[^）]*）/g, '').trim();
      box.innerHTML = list.map(o => {
        const amount = o.products.reduce((s, p) => s + p.price, 0);
        const cls = STATUS_CLS[o.status.text] || 'bg-gray-100 text-gray-500';
        const stores = [...new Set(o.products.map(p => p.store))].join('/');
        const groups = [...new Set(o.products.map(p => p.group))].map(grpShort).join('/');
        const initial = o.user.charAt(0);
        return '' +
          '<button onclick="openOrderDetail(\'' + o.no + '\')" class="w-full text-left bg-white rounded-2xl p-4 border border-gray-100 shadow-sm active:scale-[.99] transition">' +
            '<div class="flex items-center justify-between gap-2">' +
              '<div class="flex items-center gap-2.5 min-w-0">' +
                '<span class="w-9 h-9 rounded-full bg-coral-50 text-coral-600 flex items-center justify-center text-sm font-medium shrink-0">' + initial + '</span>' +
                '<div class="min-w-0">' +
                  '<p class="text-sm font-medium text-gray-800 truncate">' + o.user + '</p>' +
                  '<p class="text-[11px] text-gray-400 mt-0.5">' + o.phone + '</p>' +
                '</div>' +
              '</div>' +
              '<span class="px-2 py-0.5 ' + cls + ' text-[10px] rounded-full shrink-0">' + o.status.text + '</span>' +
            '</div>' +
            '<div class="mt-3.5">' +
              '<p class="text-[10px] text-gray-400">我的业绩</p>' +
              perfMyCell(o) +
            '</div>' +
            '<div class="mt-3 pt-3 border-t border-gray-50 flex items-center justify-between gap-2 text-[11px]">' +
              '<span class="text-gray-400 shrink-0">订单金额 <span class="text-gray-700 font-medium">' + fmt(amount) + '</span></span>' +
              '<span class="flex items-center gap-1 text-gray-400 truncate"><i class="fas fa-map-marker-alt"></i>' + stores + ' · ' + groups + '</span>' +
            '</div>' +
            '<div class="text-[10px] text-gray-400 mt-2 flex items-center justify-between gap-2"><span class="shrink-0">' + o.time.slice(0, 16) + '</span><span class="font-mono truncate text-right">单号 ' + o.no + '</span></div>' +
          '</button>';
      }).join('');
    }

    // 月份范围：period='cur' 当前月，'last' 上月
    function monthRange(period) {
      const now = new Date();
      let y = now.getFullYear(), m = now.getMonth();
      if (period === 'last') { m -= 1; if (m < 0) { m = 11; y -= 1; } }
      const pad = n => (n < 10 ? '0' + n : '' + n);
      const end = new Date(y, m + 1, 0).getDate();
      return { ym: y + '-' + pad(m + 1), from: y + '-' + pad(m + 1) + '-01', to: y + '-' + pad(m + 1) + '-' + pad(end), label: y + '年' + (m + 1) + '月' };
    }
    function monthOrders(period) {
      const ym = monthRange(period).ym;
      return ORDERS.filter(o => o.time.slice(0, 7) === ym);
    }

    let curPeriod = 'last'; // 数据卡片默认显示上月
    function renderSummaryForPeriod() {
      const list = monthOrders(curPeriod);
      const counted = list.reduce((s, o) => s + myCounted(o), 0);
      const pending = list.reduce((s, o) => s + myPending(o), 0);
      const mr = monthRange(curPeriod);
      document.getElementById('sumPeriodLabel').textContent = mr.label;
      document.getElementById('sumCounted').textContent = fmt(counted);
      document.getElementById('sumPending').textContent = fmt(pending);
      document.getElementById('sumCount').textContent = list.length;
    }
    function setPeriod(p) {
      curPeriod = p;
      document.getElementById('segCur').className = 'px-2.5 py-1 rounded-full' + (p === 'cur' ? ' bg-white text-coral-600 font-medium' : '');
      document.getElementById('segLast').className = 'px-2.5 py-1 rounded-full' + (p === 'last' ? ' bg-white text-coral-600 font-medium' : '');
      renderSummaryForPeriod();
    }

    function rerender() {
      const list = getFiltered();
      renderList(list);
    }

    function setStatus(s) {
      currentStatus = s;
      document.querySelectorAll('.status-pill').forEach(b => {
        b.classList.toggle('pill-active', b.dataset.status === s);
      });
      rerender();
    }

    // 筛选日期默认填为当前月
    (function initDates() {
      const cur = monthRange('cur');
      document.getElementById('fDateFrom').value = cur.from;
      document.getElementById('fDateTo').value = cur.to;
    })();
    document.getElementById('fSearch').addEventListener('input', rerender);
    document.getElementById('fDateFrom').addEventListener('change', rerender);
    document.getElementById('fDateTo').addEventListener('change', rerender);
    setPeriod('last'); // 数据卡片默认显示上月
    rerender();        // 列表默认显示当前月

    function openOrderDetail(orderNo) {
      const d = orderMap[orderNo];
      document.getElementById('detailOrderNo').textContent = orderNo;
      document.getElementById('detailUser').textContent = d.user;
      document.getElementById('detailPhone').textContent = d.phone;
      document.getElementById('detailTime').textContent = d.time;
      const st = document.getElementById('detailStatus');
      st.textContent = d.status.text;
      st.className = 'px-2 py-0.5 ' + (STATUS_CLS[d.status.text] || 'bg-gray-100 text-gray-500') + ' text-xs rounded';

      // 行程核验信息
      const t = d.trip || {};
      document.getElementById('tripName').textContent = t.name || '--';
      document.getElementById('tripCountry').textContent = t.country || '--';
      document.getElementById('tripIdType').textContent = t.idType || '--';
      document.getElementById('tripIdNo').textContent = t.idNo || '--';
      document.getElementById('tripPhone').textContent = t.phone || '--';

      const isCompleted = d.status.text === '已完成';
      const box = document.getElementById('detailProducts');
      box.innerHTML = '';
      // 仅展示归属本人业绩的商品（过滤同事业绩的商品）
      const myProducts = d.products.filter(p => p.guide === ME);
      if (myProducts.length === 0) {
        box.innerHTML = '<p class="text-xs text-gray-400 py-3 text-center">本单暂无归属本人的商品</p>';
      } else {
        myProducts.forEach(p => {
          box.insertAdjacentHTML('beforeend', productRow(p, isCompleted));
        });
      }
      document.getElementById('detailProductCount').textContent = myProducts.length;

      // 我的业绩归因汇总：仅本人归因且已完成未退款计入
      const counted = myCounted(d);
      const perfBox = document.getElementById('detailPerf');
      if (counted > 0) {
        perfBox.innerHTML = '<div class="flex items-center justify-between bg-coral-50 rounded-xl px-3 py-2.5">' +
          '<span class="text-xs text-gray-600">本单我的业绩（计入）</span>' +
          '<span class="text-base font-bold text-coral-600">' + fmt(counted) + '</span></div>';
      } else if (!isCompleted) {
        perfBox.innerHTML = '<p class="text-xs text-gray-400">本单状态为「' + d.status.text + '」，整单不计入我的业绩。</p>';
      } else {
        perfBox.innerHTML = '<p class="text-xs text-gray-400">本单已完成，但商品均已退款 / 非本人归因，我的业绩 ¥0。</p>';
      }

      const subtotal = d.products.reduce((s, p) => s + p.price, 0);
      const paid = subtotal - d.discount - d.platform - d.coupon - d.point + d.ship;
      document.getElementById('amtSubtotal').textContent = fmt(subtotal);
      document.getElementById('amtDiscount').textContent = '-' + fmt(d.discount);
      document.getElementById('amtPlatform').textContent = '-' + fmt(d.platform);
      document.getElementById('amtCoupon').textContent = '-' + fmt(d.coupon);
      document.getElementById('amtPoint').textContent = '-' + fmt(d.point);
      document.getElementById('amtShip').textContent = fmt(d.ship);
      document.getElementById('amtPaid').textContent = fmt(paid);

      document.getElementById('orderDetailModal').classList.remove('hidden');
    }
    function closeOrderDetail() {
      document.getElementById('orderDetailModal').classList.add('hidden');
    }
    function copyOrderNo() {
      const no = document.getElementById('detailOrderNo').textContent;
      const btn = document.getElementById('copyOrderBtn');
      const mark = () => {
        const i = btn.querySelector('i');
        i.classList.remove('fa-copy'); i.classList.add('fa-check'); i.style.color = '#16a34a';
        setTimeout(() => { i.classList.remove('fa-check'); i.classList.add('fa-copy'); i.style.color = ''; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(no).then(mark).catch(() => fallbackCopy(no, mark));
      } else { fallbackCopy(no, mark); }
    }
    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); cb && cb();
    }
  </script>
</body>
</html>
