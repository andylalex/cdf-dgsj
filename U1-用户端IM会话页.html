<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用户端 - 与导购对话（商品图集）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coral: { 50: '#fff5f5', 100: '#ffe5e5', 200: '#ffcccc', 300: '#ffaaaa', 400: '#ff7a7a', 500: '#ff6b6b', 600: '#e85d5d', 700: '#d14949', 800: '#b33b3b', 900: '#8f2e2e' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .phone-frame { max-width: 414px; margin: 0 auto; min-height: 100vh; background: #f8f9fa; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100">
  <div class="phone-frame shadow-2xl overflow-hidden flex flex-col relative">
    <!-- 顶部 -->
    <div class="bg-white px-4 pt-12 pb-3 border-b border-gray-100 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <button class="p-2 hover:bg-gray-100 rounded-full transition">
          <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=linxiaoting" class="w-10 h-10 rounded-full bg-gray-100" alt="">
        <div>
          <h1 class="text-base font-semibold text-gray-800">林小婷 · 专属导购</h1>
          <p class="text-xs text-gray-500">中免海南 · Cartier 柜组</p>
        </div>
      </div>
      <button class="p-2 hover:bg-gray-100 rounded-full transition">
        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
      </button>
    </div>

    <!-- 聊天区 -->
    <div id="chat" class="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-4 bg-gray-50">
      <div class="text-center text-xs text-gray-400">今天 14:45</div>

      <!-- 品牌推荐卡片（G3 品牌卡样式）：兰蔻 -->
      <div class="flex gap-2.5">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=linxiaoting" class="w-9 h-9 rounded-full bg-white shadow-sm shrink-0" alt="">
        <div class="max-w-[92%] w-full">
          <div class="bg-white rounded-2xl rounded-bl-md shadow-md overflow-hidden border border-coral-100">
            <div class="px-3 py-1.5 flex items-center justify-between gap-2 border-b border-gray-50">
              <div class="flex items-center gap-2">
                <img src="assets/brands/兰蔻.jpg" class="w-9 h-9 rounded-full object-contain bg-white border border-gray-100" alt="兰蔻">
                <span class="text-sm font-semibold text-gray-800">兰蔻</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] text-gray-500">在售 12 件</span>
                <a href="G4-推荐商品页.html" class="text-[10px] bg-coral-500 hover:bg-coral-600 text-white px-2.5 py-1 rounded-full font-medium transition shadow-sm">进入品牌馆 ›</a>
              </div>
            </div>
            <div class="relative bg-gray-900">
              <img src="assets/brands/兰蔻视觉.jpg" class="w-full aspect-[25/14] object-cover" alt="兰蔻视觉">
            </div>
          </div>
          <span class="text-[10px] text-gray-400 mt-1 ml-1">14:45</span>
        </div>
      </div>

      <!-- 单品推荐卡片（G3 单品卡样式）：Kelly 25 -->
      <div class="flex gap-2.5">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=linxiaoting" class="w-9 h-9 rounded-full bg-white shadow-sm shrink-0" alt="">
        <div class="max-w-[92%] w-full">
          <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">
            <div class="relative">
              <img src="assets/generated/c1.png" class="w-full h-72 object-cover" alt="爱马仕 Kelly 25">
              <div class="absolute top-2.5 left-2.5 flex flex-wrap gap-1 max-w-[72%]">
                <span class="bg-amber-500 text-white text-[10px] leading-none px-2 py-1 rounded-md font-medium shadow-sm">一口价</span>
                <span class="bg-amber-500 text-white text-[10px] leading-none px-2 py-1 rounded-md font-medium shadow-sm">赠品</span>
                <span class="bg-amber-500 text-white text-[10px] leading-none px-2 py-1 rounded-md font-medium shadow-sm">券</span>
                <span class="bg-amber-500 text-white text-[10px] leading-none px-2 py-1 rounded-md font-medium shadow-sm">2件6折</span>
                <span class="bg-emerald-500 text-white text-[10px] leading-none px-2 py-1 rounded-md font-medium shadow-sm">政府消费券</span>
              </div>
            </div>
            <div class="p-3.5">
              <div class="flex items-center gap-1.5">
                <span class="inline-flex items-center gap-0.5 bg-coral-50 text-coral-600 text-[10px] font-semibold px-1.5 py-0.5 rounded shrink-0">离岛免税</span>
                <span class="text-sm font-semibold text-gray-800 leading-snug truncate">爱马仕Kelly 25 · 经典橙</span>
              </div>
              <div class="mt-3 flex items-end gap-3">
                <div class="flex items-baseline gap-0.5">
                  <span class="text-[13px] text-coral-600 font-semibold">¥</span>
                  <span class="text-2xl font-bold text-coral-600 leading-none">72,000</span>
                </div>
                <span class="text-sm text-gray-400 line-through leading-none pb-0.5">¥88,000</span>
              </div>
            </div>
          </div>
          <span class="text-[10px] text-gray-400 mt-1 ml-1">14:48</span>
        </div>
      </div>

      <!-- 优惠券卡片 · 待领取 -->
      <div class="flex gap-2.5">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=linxiaoting" class="w-9 h-9 rounded-full bg-white shadow-sm shrink-0" alt="">
        <div class="max-w-[90%] w-full">
          <div class="bg-white rounded-2xl rounded-bl-md shadow-md overflow-hidden border border-coral-100">
            <div class="bg-gradient-to-r from-coral-500 to-coral-600 px-4 py-2.5 text-white flex items-center justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                <span class="font-semibold text-sm">专属优惠券</span>
              </div>
              <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">待领取</span>
            </div>
            <div class="p-3.5">
              <div class="flex items-baseline gap-1 mb-1">
                <span class="text-2xl font-bold text-coral-600">¥500</span>
                <span class="text-sm text-gray-600">满 ¥5,000 可用</span>
              </div>
              <p class="text-xs text-gray-500">适用于：香化类商品 · 限本单使用</p>
              <p class="text-[10px] text-gray-400 mt-2">有效期至 2026-08-31 23:59</p>
              <button class="w-full mt-3 bg-coral-500 hover:bg-coral-600 text-white py-2 rounded-xl text-sm font-semibold transition">领取优惠券</button>
            </div>
          </div>
          <span class="text-[10px] text-gray-400 mt-1 ml-1">14:50</span>
        </div>
      </div>

      <!-- 优惠券卡片 · 已领取 -->
      <div class="flex gap-2.5">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=linxiaoting" class="w-9 h-9 rounded-full bg-white shadow-sm shrink-0" alt="">
        <div class="max-w-[90%] w-full">
          <div class="bg-white rounded-2xl rounded-bl-md shadow-md overflow-hidden border border-gray-100">
            <div class="bg-gray-100 px-4 py-2.5 text-gray-700 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                <span class="font-semibold text-sm">专属优惠券</span>
              </div>
              <span class="text-[10px] bg-green-500 text-white px-2 py-0.5 rounded-full">已领取</span>
            </div>
            <div class="p-3.5">
              <div class="flex items-baseline gap-1 mb-1">
                <span class="text-2xl font-bold text-gray-700">¥1,000</span>
                <span class="text-sm text-gray-500">满 ¥10,000 可用</span>
              </div>
              <p class="text-xs text-gray-400">适用于：全品类 · 限本单使用</p>
              <p class="text-[10px] text-gray-400 mt-2">有效期至 2026-08-31 23:59</p>
          <div class="w-full mt-3 bg-gray-100 text-gray-400 py-2 rounded-xl text-sm font-semibold text-center">已领取</div>
          </div>
        </div>
        <span class="text-[10px] text-gray-400 mt-1 ml-1">14:52</span>
      </div>

    </div>

    </div>

    <!-- 底部输入 -->
    <div class="bg-white border-t border-gray-100 p-3 shrink-0">
      <div class="flex items-center gap-2">
        <button class="p-2 text-gray-400 hover:text-coral-500 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
        <div class="flex-1 bg-gray-100 rounded-full px-4 py-2.5">
          <input type="text" placeholder="回复导购..." class="w-full bg-transparent text-sm outline-none text-gray-700">
        </div>
        <button id="plusBtn" class="p-2 text-gray-400 hover:text-coral-500 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
        </button>
        <button class="bg-coral-500 hover:bg-coral-600 text-white p-2.5 rounded-full transition shadow-lg shadow-coral-500/30">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
