<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>专属导购消息列表</title>
<link rel="stylesheet" href="assets/font-awesome/all-embedded.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--red:#fa5151}
  body{background:#e9e9e9;font-family:"Noto Sans SC","PingFang SC","Helvetica Neue",Arial,sans-serif}
  .phone-frame{max-width:414px;margin:0 auto;height:100dvh;overflow:hidden;display:flex;flex-direction:column;position:relative;
    background:linear-gradient(180deg,#f7ccca 0%,#fadfdd 20%,#ffffff 46%)}
  .phone-frame>*{min-height:0}

  /* 状态栏 */
  .status-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 18px 4px;color:#111}
  .status-bar .t{font-size:15px;font-weight:600;letter-spacing:.2px}
  .status-bar .r{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
  .status-bar .r i{font-size:12px}

  /* 顶部导航 */
  .navbar{flex:0 0 auto;display:flex;align-items:center;height:48px;padding:0 12px;position:relative}
  .navbar .back{border:0;background:transparent;padding:6px 8px;margin-left:-4px;color:#1a1a1a;cursor:pointer;display:flex;align-items:center}
  .navbar .back i{font-size:18px}
  .navbar .title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;color:#1a1a1a;white-space:nowrap}
  .navbar .capsule{margin-left:auto;width:88px;height:32px;border-radius:16px;background:rgba(30,30,30,.82);display:flex;align-items:center;color:#fff}
  .navbar .capsule .half{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px}
  .navbar .capsule .sep{width:1px;height:18px;background:rgba(255,255,255,.35)}

  /* 消息列表 */
  .list{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 20px}
  .msg{display:flex;align-items:center;gap:11px;background:#fff;border-radius:10px;padding:12px;margin-bottom:9px;cursor:pointer;
       box-shadow:0 1px 2px rgba(180,120,115,.06);transition:transform .14s}
  .msg:active{transform:scale(.985)}
  .msg .av{flex:0 0 auto;width:46px;height:46px;border-radius:50%;object-fit:cover;background:#f3e3e1}
  .msg .mid{flex:1 1 auto;min-width:0}
  .msg .name{font-size:15px;font-weight:600;color:#1a1a1a;line-height:1.3}
  .msg .prev{margin-top:4px;font-size:13px;color:#9b9b9b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg .right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
  .msg .time{font-size:12px;color:#9b9b9b}
  .msg .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:500}
</style>
</head>
<body>
<div class="phone-frame">

  <!-- 状态栏 -->
  <div class="status-bar">
    <span class="t">9:41</span>
    <span class="r"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters" style="font-size:14px"></i></span>
  </div>

  <!-- 顶部导航 -->
  <div class="navbar">
    <button class="back" aria-label="返回" onclick="goBack()"><i class="fas fa-chevron-left"></i></button>
    <div class="title">专属导购消息列表(3)</div>
    <div class="capsule">
      <span class="half"><i class="fas fa-ellipsis-h"></i></span>
      <span class="sep"></span>
      <span class="half"><i class="fas fa-dot-circle"></i></span>
    </div>
  </div>

  <!-- 消息列表 -->
  <div class="list">
    <div class="msg" onclick="location.href='U1-用户端IM会话页.html'">
      <img class="av" src="assets/generated/advisor1.png" alt="导购-张三" onerror="this.onerror=null;this.src='assets/avatars/zhang.svg'">
      <div class="mid">
        <div class="name">导购-张三</div>
        <div class="prev">快来领取你的专属新人礼...</div>
      </div>
      <div class="right">
        <span class="time">10:20</span>
        <span class="dot">1</span>
      </div>
    </div>

    <div class="msg" onclick="location.href='U1-用户端IM会话页.html'">
      <img class="av" src="assets/generated/advisor2.png" alt="导购-李现" onerror="this.onerror=null;this.src='assets/avatars/li.svg'">
      <div class="mid">
        <div class="name">导购-李现</div>
        <div class="prev">快来领取你的专属新人礼...</div>
      </div>
      <div class="right">
        <span class="time">09:29</span>
        <span class="dot">1</span>
      </div>
    </div>

    <div class="msg" onclick="location.href='U1-用户端IM会话页.html'">
      <img class="av" src="assets/generated/advisor3.png" alt="导购-张可" onerror="this.onerror=null;this.src='assets/avatars/zhang.svg'">
      <div class="mid">
        <div class="name">导购-张可</div>
        <div class="prev">快来领取你的专属新人礼...</div>
      </div>
      <div class="right">
        <span class="time">03/01</span>
        <span class="dot">1</span>
      </div>
    </div>
  </div>

</div>

<script>
  // 动态返回上一页：优先回退到来源页，无历史则回原型首页
  function goBack() {
    try {
      var ref = document.referrer;
      if (ref && new URL(ref).origin === location.origin) { location.href = ref; return; }
    } catch (e) {}
    if (history.length > 1) { history.back(); return; }
    location.href = 'index.html';
  }
</script>
</body>
</html>
