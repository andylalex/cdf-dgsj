    .phone-frame{max-width:414px;height:100dvh;overflow:hidden;margin:0 auto;background:#f5f5f5;display:flex;flex-direction:column;position:relative}

    :root{--gold:#b8860f;--gold-deep:#9c6f1c;--gold-bg1:#fbf3e4;--gold-bg2:#f4e9d2}

    /* 状态栏 */
    .status-bar{flex:0 0 auto;height:44px;padding:10px 16px 0;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:#1a1a1a;background:#fff}

    .status-bar .icons i{font-size:13px}
    .status-bar .battery{width:22px;height:11px;border:1px solid #1a1a1a;border-radius:2px;position:relative;display:flex;align-items:center;padding:1px}
    .status-bar .battery::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:4px;background:#1a1a1a;border-radius:0 1px 1px 0}
    .status-bar .battery i{width:65%;height:100%;background:#1a1a1a;border-radius:1px;display:block}

    /* 顶部栏（小程序样式：返回 + 居中标题 + 胶囊） */
    .top-header{flex:0 0 auto;background:#fff;padding:8px 12px 12px;display:flex;align-items:center}
    .top-header .back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#1a1a1a;font-size:20px;cursor:pointer}
    .top-header .hd-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:#1a1a1a}
    .mini-caps{flex-shrink:0;display:flex;align-items:center;background:rgba(255,255,255,.9);border:1px solid #e3e4e8;border-radius:999px;padding:0 11px;height:32px;gap:10px;color:#1a1a1a;font-size:15px;cursor:pointer}
    .mini-caps .sep{width:1px;height:18px;background:#e3e4e8}

    /* 滚动区 */
    .scroll-area{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
    .scroll-area::-webkit-scrollbar{display:none}

    /* 通用白卡 */
    .card{background:#fff;border-radius:12px;margin:10px 10px 0;overflow:hidden}

    /* 状态卡（金棕主题） */
    .status-card{border-radius:12px;margin:10px 10px 0;overflow:hidden;background:linear-gradient(180deg,var(--gold-bg1) 0%,var(--gold-bg2) 100%);padding:0 16px 18px}
    .status-card .strip{height:6px;background:var(--gold);margin:0 -16px 18px}
    .status-main{display:flex;align-items:center;gap:12px;cursor:pointer}
    .status-main .s-ic{font-size:26px;color:var(--gold)}
    .status-main .s-txt{font-size:21px;font-weight:700;color:var(--gold)}
    .status-main .s-arrow{font-size:14px;color:var(--gold);margin-left:2px}
    .status-sub{margin-top:10px;font-size:14px;color:#a8946a}

    .pickup-row .name{font-weight:700}

    .info-row .i-ic{width:18px;text-align:center;font-size:15px;color:#6b7280;flex-shrink:0;margin-top:1px}
    .info-row .i-label{flex-shrink:0}
    .info-row .i-val{flex:1;min-width:0;word-break:break-all}

    /* 订单编号卡 */
    .no-row{display:flex;align-items:center;gap:8px;padding:14px 12px;font-size:13px}
    .no-row .no-label{color:#6b7280;flex-shrink:0}
    .no-row .no-val{flex:1;min-width:0;font-family:Arial,sans-serif;letter-spacing:.3px;color:#1a1a1a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .no-row .copy-btn{flex-shrink:0;font-size:12px;color:#374151;background:#f3f4f6;border-radius:4px;padding:3px 8px;cursor:pointer}
    .no-row .chev{flex-shrink:0;color:#9ca3af;font-size:12px;cursor:pointer}
    .contact-row{border-top:1px solid #f3f4f6;padding:13px 0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:#1a1a1a;cursor:pointer}
    .contact-row i{color:var(--gold);font-size:16px}

    /* 商品列表卡 */

    .item-row{display:flex;gap:10px;padding:12px}
    .item-thumb{width:78px;height:78px;border-radius:6px;background:#f9fafb;overflow:hidden;flex-shrink:0}
    .item-thumb img{width:100%;height:100%;object-fit:cover}
    .item-body{flex:1;min-width:0;display:flex;flex-direction:column}
    .item-head{display:flex;align-items:flex-start;gap:6px}
    .store-tag{flex-shrink:0;font-size:11px;font-weight:600;color:#fff;background:var(--gold);border-radius:4px;padding:2px 5px;margin-top:1px}
    .item-name{font-size:14px;font-weight:600;color:#1a1a1a;line-height:1.4}
    .item-mid{display:flex;align-items:baseline;margin-top:8px}
    .item-spec{font-size:13px;color:#6b7280}
    .item-pay{margin-left:auto;text-align:right;white-space:nowrap}
    .item-pay .pay-label{font-size:12px;color:#6b7280}
    .item-pay .pay-amt{font-size:17px;font-weight:800;color:var(--gold)}
    .item-pay .pay-origin{font-size:11px;color:#9ca3af;text-decoration:line-through;margin-left:6px}
    .item-foot{margin-top:8px}
    .refund-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#6b7280;background:#f3f4f6;border-radius:4px;padding:5px 9px;cursor:pointer}
    .refund-tag i{font-size:10px;color:#9ca3af}

    /* 简单行卡（发票/优惠券） */
    .simple-row{display:flex;align-items:center;justify-content:space-between;padding:16px 12px;font-size:15px;color:#1a1a1a}
    .simple-row .r-val{font-size:14px;color:#6b7280}
    .simple-row .r-val .r-amt{color:#1a1a1a}

    .spacer{height:24px;flex-shrink:0}

    /* 底部 home 条 */
    .home-bar{flex:0 0 auto;background:#f5f5f5;padding:8px 0 10px;display:flex;justify-content:center}
    .home-bar .bar{width:134px;height:5px;border-radius:3px;background:#111}
