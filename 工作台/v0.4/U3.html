    /* 导购推荐信息栏（头图内一栏，随内容滚动，非浮层） */
    @keyframes guideTipIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .guide-bar { background: #fff5f4; border: 1px solid #ffe0dc; border-radius: 12px;

    .guide-bar.is-platform { background: #f6f6f6; border-color: #ececec; }
    /* 导购模式退出 / 恢复按钮 */
    .exit-btn { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;

                font-size: 11px; line-height: 1; white-space: nowrap; background: #fff;
                border: 1px solid transparent; font-weight: 500;
                transition: color .2s ease, background-color .2s ease, border-color .2s ease; }
    .exit-btn i { font-size: 10px; }
    .exit-btn.exit-guide  { color: #E02E24; border-color: #ffc9c4; }
    .exit-btn.enter-guide { color: #6b7280; border-color: #e5e7eb; }
    /* 切换提示 toast */
    #guideToast { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%);

  <script>
    // 型号切换交互
    document.querySelectorAll('.model-thumb').forEach(thumb => {
      thumb.addEventListener('click', () => {
        document.querySelectorAll('.model-thumb').forEach(t => {
          t.classList.remove('active');
          t.classList.add('border-gray-200');
          t.classList.remove('border-brand');
        });
        thumb.classList.add('active');
        thumb.classList.remove('border-gray-200');
        thumb.classList.add('border-brand');
      });
    });

    // 导购推荐信息栏：点「退出导购模式」切到平台视角，可再点「进入导购模式」切回
    (function () {
      var bar = document.getElementById('guideBar');
      var exitBtn = document.getElementById('guideBarExit');
      var toast = document.getElementById('guideToast');
      if (!bar || !exitBtn) return;
      var toastTimer = null;

      var SALES = {
        store: {
          title: '李婷 · 专属导购 · 三亚国际免税城',
          icon: 'fa-store',
          iconColor: 'text-brand',
          titleColor: 'text-gray-900',
          dot: 'bg-green-500',
          label: '门店有货',
          num: '8',
          note: '· 可到店自提',
          btnIcon: 'fa-sign-out-alt',
          btnText: '退出导购模式',
          btnClass: 'exit-guide',
          tip: '已恢复导购模式 · 李婷 · 三亚国际免税城 · 门店有货 8 件'
        },
        platform: {
          title: '中免海南平台统仓',
          icon: 'fa-warehouse',
          iconColor: 'text-gray-500',
          titleColor: 'text-gray-700',
          dot: 'bg-green-500',
          label: '平台有货',
          num: '26',
          note: '· 全国发货',
          btnIcon: 'fa-sign-in-alt',
          btnText: '进入导购模式',
          btnClass: 'enter-guide',
          tip: '已退出导购模式 · 中免海南平台统仓 · 平台有货 26 件'
        }
      };

      function showToast(text) {
        if (!toast) return;
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }

      var exitBtnIcon = document.getElementById('guideBarExitIcon');
      var exitBtnText = document.getElementById('guideBarExitText');

      exitBtn.addEventListener('click', function () {
        var next = exitBtn.getAttribute('data-mode') === 'store' ? 'platform' : 'store';
        var cfg = SALES[next];
        if (!cfg) return;

        exitBtn.setAttribute('data-mode', next);
        if (exitBtnIcon) exitBtnIcon.className = 'fas ' + cfg.btnIcon;
        if (exitBtnText) exitBtnText.textContent = cfg.btnText;
        exitBtn.classList.remove('exit-guide', 'enter-guide');
        exitBtn.classList.add(cfg.btnClass);

        var icon = document.getElementById('guideBarIcon');
          if (icon) icon.className = 'fas ' + cfg.icon + ' text-[10px] ' + cfg.iconColor + ' shrink-0';

          var title = document.getElementById('guideBarTitle');
          if (title) {
            title.textContent = cfg.title;
            title.classList.remove('text-gray-900', 'text-gray-700');
            title.classList.add(cfg.titleColor);
          }

          var dot = document.getElementById('guideBarDot');
          if (dot) dot.className = 'w-1.5 h-1.5 rounded-full shrink-0 ' + cfg.dot;

          var label = document.getElementById('guideBarLabel');
          if (label) label.textContent = cfg.label;
          var num = document.getElementById('guideBarNum');
          if (num) num.textContent = cfg.num;
          var note = document.getElementById('guideBarNote');
          if (note) note.textContent = cfg.note;

        bar.classList.toggle('is-platform', next === 'platform');
        showToast(cfg.tip);
      });
    })();  

    // SKU 选择弹窗
    (function () {
      var modal = document.getElementById('skuModal');
      var mask = document.getElementById('skuModalMask');
      var panel = document.getElementById('skuModalPanel');
      var close = document.getElementById('skuModalClose');
      var addMain = document.getElementById('btnAddToBag');
      var buyMain = document.getElementById('btnBuyNow');
      var addModal = document.getElementById('skuModalAdd');
      var buyModal = document.getElementById('skuModalBuy');
      var qtyInput = document.getElementById('skuQtyInput');
      var qty = 1;
      var state = {
        model: 'iPhone 17 Pro Max',
        color: '星宇橙色',
        storage: '256GB'
      };
      var selectedEl = document.getElementById('skuModalSelected');

      function updateSelected() {
        if (selectedEl) selectedEl.textContent = state.model + ' + ' + state.color + ' + ' + state.storage;
      }

      function openModal() {
        if (!modal || !panel) return;
        modal.classList.remove('hidden');
        // 强制重排后加 translate-y-0
        void panel.offsetWidth;
        panel.classList.remove('translate-y-full');
        panel.classList.add('translate-y-0');
      }

      function closeModal() {
        if (!modal || !panel) return;
        panel.classList.remove('translate-y-0');
        panel.classList.add('translate-y-full');
        setTimeout(function () { modal.classList.add('hidden'); }, 300);
      }

      function selectOption(btn) {
        var group = btn.parentElement;
        if (!group) return;
        var key = group.getAttribute('data-sku-group');
        var val = btn.getAttribute('data-value');
        group.querySelectorAll('.sku-opt').forEach(function (b) {
          b.classList.remove('sku-active', 'border-brand', 'text-red-500');
          b.classList.add('border-gray-200', 'text-gray-800');
        });
        btn.classList.remove('border-gray-200', 'text-gray-800');
        btn.classList.add('sku-active', 'border-brand', 'text-red-500');
        if (key && val) state[key] = val;
        updateSelected();
      }

      document.querySelectorAll('#skuModelGroup .sku-opt, #skuColorGroup .sku-opt, #skuStorageGroup .sku-opt').forEach(function (btn) {
        btn.addEventListener('click', function () { selectOption(btn); });
      });

      document.getElementById('skuQtyMinus').addEventListener('click', function () {
        if (qty > 1) { qty--; qtyInput.value = qty; }
      });
      document.getElementById('skuQtyPlus').addEventListener('click', function () {
        if (qty < 99) { qty++; qtyInput.value = qty; }
      });

      [addMain, buyMain].forEach(function (btn) {
        if (btn) btn.addEventListener('click', openModal);
      });
      [mask, close].forEach(function (el) {
        if (el) el.addEventListener('click', closeModal);
      });
      [addModal, buyModal].forEach(function (btn) {
        if (btn) btn.addEventListener('click', function () {
          closeModal();
          showToast('已选：' + state.model + ' + ' + state.color + ' + ' + state.storage + '，数量 ' + qty);
        });
      });
    })();
</script>
