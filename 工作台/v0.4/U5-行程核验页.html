  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用户端 - 离岛行程核验</title>
  <style>
    body { font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
    .phone-frame { max-width:414px; margin:0 auto; height:100vh; height:100dvh; overflow:hidden; background:#f2f3f5; }
    .phone-frame > * { min-height:0; }
    .phone-frame > * { min-height:0; }
    .hide-scrollbar::-webkit-scrollbar { display:none; }
    .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    .form-label { font-size:13px; color:#374151; font-weight:500; margin-bottom:6px; display:block; }
    .form-input { width:100%; height:42px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; padding:0 12px; font-size:14px; color:#1f2937; outline:none; }
    .form-input:focus { border-color:#ff6b52; }
    .type-tab { flex:1; text-align:center; padding:10px 0; font-size:13px; color:#6b7280; border-bottom:2px solid transparent; cursor:pointer; }
    .type-tab.active { color:#ff6b52; border-bottom-color:#ff6b52; font-weight:600; }
    .toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.7); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; z-index:70; }
  </style>
</head>
<body class="bg-gray-200" data-page-node-id="U5Body">
  <div class="phone-frame shadow-2xl overflow-hidden flex flex-col bg-[#f2f3f5]" data-page-node-id="U5Frame">

    <!-- 状态栏 -->
    <div class="bg-white px-5 pt-2 pb-1 flex items-center justify-between shrink-0 text-[13px] font-semibold text-black" data-page-node-id="U5Status">
      <span>9:32</span>
      <div class="flex items-center gap-1 text-[11px]">
        <i class="fas fa-location-dot text-[10px]"></i>
        <i class="fas fa-circle text-[8px] text-blue-500"></i>
        <i class="fas fa-square text-[8px]"></i>
        <i class="fas fa-record-vinyl text-[8px]"></i>
        <span class="bg-blue-500 text-white rounded-sm px-1 text-[9px] font-bold ml-0.5">8K</span>
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <span class="border border-black rounded-sm px-1 text-[10px] font-bold">90</span>
      </div>
    </div>

    <!-- 顶栏 -->
    <div class="bg-white flex items-center justify-center px-4 py-3 shrink-0 relative border-b border-gray-100" data-page-node-id="U5Header">
      <a href="U4-用户订单确认页.html" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-full active:bg-gray-100 transition" data-page-node-id="U5Back">
        <i class="fas fa-chevron-left text-gray-700 text-base"></i>
      </a>
      <h1 class="text-base font-semibold text-gray-800" data-page-node-id="U5Title">离岛行程核验</h1>
    </div>

    <!-- 内容区 -->
    <div id="content" class="flex-1 min-h-0 overflow-y-auto hide-scrollbar" data-page-node-id="U5Content">

      <!-- 状态提示 -->
      <div class="bg-coral-50 px-4 py-3" data-page-node-id="U5Tip">
        <p class="text-[12px] text-coral-600 leading-snug" data-page-node-id="U5TipText"><i class="fas fa-info-circle mr-1"></i>请填写真实离岛行程信息，核验通过后方可支付。海南免税购物需凭有效离岛凭证提货。</p>
      </div>

      <div class="p-4 space-y-3 pb-24" data-page-node-id="U5FormWrap">
        <!-- 离岛方式 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm" data-page-node-id="U5Type">
          <p class="text-[15px] font-semibold text-gray-800 mb-3" data-page-node-id="U5TypeTitle">离岛方式</p>
          <div class="flex border-b border-gray-100" data-page-node-id="U5TypeTabs">
            <div class="type-tab active" data-type="flight" onclick="selectType(this)" data-page-node-id="U5TypeFlight">飞机</div>
            <div class="type-tab" data-type="train" onclick="selectType(this)" data-page-node-id="U5TypeTrain">火车</div>
            <div class="type-tab" data-type="ship" onclick="selectType(this)" data-page-node-id="U5TypeShip">轮船</div>
          </div>
        </div>

        <!-- 表单 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm space-y-4" data-page-node-id="U5Form">
          <div data-page-node-id="U5FieldNo">
            <label class="form-label" data-page-node-id="U5LabelNo">航班号</label>
            <input id="tripNo" type="text" placeholder="如 HU7281" class="form-input" data-page-node-id="U5InputNo">
          </div>
          <div data-page-node-id="U5FieldDate">
            <label class="form-label" data-page-node-id="U5LabelDate">出发时间</label>
            <input id="tripDate" type="datetime-local" class="form-input" data-page-node-id="U5InputDate">
          </div>
          <div data-page-node-id="U5FieldPort">
            <label class="form-label" data-page-node-id="U5LabelPort">出发/到达机场</label>
            <input id="tripPort" type="text" placeholder="如 海口美兰机场 → 北京首都机场" class="form-input" data-page-node-id="U5InputPort">
          </div>
          <div data-page-node-id="U5FieldName">
            <label class="form-label" data-page-node-id="U5LabelName">旅客姓名</label>
            <input id="tripName" type="text" placeholder="请与证件保持一致" class="form-input" data-page-node-id="U5InputName">
          </div>
          <div data-page-node-id="U5FieldIdcard">
            <label class="form-label" data-page-node-id="U5LabelIdcard">身份证号</label>
            <input id="tripIdcard" type="text" placeholder="请输入身份证号码" class="form-input" data-page-node-id="U5InputIdcard">
          </div>
          <div data-page-node-id="U5FieldPhone">
            <label class="form-label" data-page-node-id="U5LabelPhone">手机号</label>
            <input id="tripPhone" type="tel" placeholder="用于接收提货通知" class="form-input" data-page-node-id="U5InputPhone">
          </div>
        </div>
      </div>

    </div>

    <!-- 底部吸底栏 -->
    <div class="bg-white px-4 py-3 shrink-0 border-t border-gray-100 pb-safe" data-page-node-id="U5Footer">
      <button onclick="confirmVerify()" class="w-full bg-coral-500 text-white py-3 rounded-full text-[15px] font-semibold active:scale-95 transition shadow-lg shadow-coral-500/30" data-page-node-id="U5FooterBtn">确认核验</button>
    </div>

  </div>

  <script>
    const TYPE_LABELS = {
      flight: { no: '航班号', port: '出发/到达机场', placeholder: '如 HU7281' },
      train: { no: '车次', port: '出发/到达车站', placeholder: '如 Z202' },
      ship: { no: '船次', port: '出发/到达港口', placeholder: '如 海峡号' }
    };

    function selectType(el) {
      document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      const type = el.dataset.type;
      const cfg = TYPE_LABELS[type];
      document.querySelector('[data-page-node-id="U5LabelNo"]').textContent = cfg.no;
      document.querySelector('[data-page-node-id="U5LabelPort"]').textContent = cfg.port;
      document.getElementById('tripNo').placeholder = cfg.placeholder;
    }

    function showToast(text) {
      let t = document.getElementById('toast');
      if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
      t.textContent = text;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 1500);
    }

    function getVerifyInfo() {
      try { return JSON.parse(localStorage.getItem('tripVerifyInfo')) || null; } catch(e) { return null; }
    }
    function saveVerifyInfo(info) { localStorage.setItem('tripVerifyInfo', JSON.stringify(info)); }

    function confirmVerify() {
      const type = document.querySelector('.type-tab.active').dataset.type;
      const typeLabel = { flight: '飞机', train: '火车', ship: '轮船' }[type];
      const flightNo = document.getElementById('tripNo').value.trim() || 'HU7281';
      const date = document.getElementById('tripDate').value || '2026-09-10T14:30';
      const port = document.getElementById('tripPort').value.trim() || '海口美兰机场 → 北京首都机场';
      const name = document.getElementById('tripName').value.trim() || '张雅';
      const idcard = document.getElementById('tripIdcard').value.trim() || '4601021990****0021';
      const phone = document.getElementById('tripPhone').value.trim() || '13800008899';
      const info = { type, typeLabel, flightNo, date, port, name, idcard, phone, passed: true };
      saveVerifyInfo(info);
      goBackAfterVerify();
    }

    // 确认核验后动态返回上一级页面：优先用 from 参数，其次用 referrer 推断，最后退浏览器历史。
    function goBackAfterVerify() {
      var params = new URLSearchParams(window.location.search);
      var from = params.get('from');
      var target = null;
      if (from === 'U6') target = 'U6-购物清单页.html';
      else if (from === 'U4') target = 'U4-用户订单确认页.html';
      else if (document.referrer) {
        var m = document.referrer.match(/([^\/]+\.html)(?:[?#]|$)/);
        if (m) target = m[1];
      }
      if (target) window.location.href = target;
      else if (window.history && window.history.length > 1) window.history.back();
      else window.location.href = 'U4-用户订单确认页.html';
    }

    window.addEventListener('DOMContentLoaded', function() {
      const info = getVerifyInfo();
      if (info) {
        document.querySelector('.type-tab[data-type="' + info.type + '"]').click();
        document.getElementById('tripNo').value = info.flightNo || '';
        document.getElementById('tripDate').value = info.date || '';
        document.getElementById('tripPort').value = info.port || '';
        document.getElementById('tripName').value = info.name || '';
        document.getElementById('tripIdcard').value = info.idcard || '';
        document.getElementById('tripPhone').value = info.phone || '';
      }
    });
  </script>
</body>
