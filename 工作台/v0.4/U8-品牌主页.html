          <a href="U7-奢品顾问列表页.html" class="text-[12px] text-gray-400 active:text-gray-600 transition" data-page-node-id="U8GuideAll">全部<i class="fas fa-chevron-right text-[9px] ml-0.5" data-page-node-id="U8GuideAllCaret"></i></a>
        </div>
        <div id="guideList" class="flex gap-3 mt-3 overflow-x-auto hide-scrollbar" style="-webkit-overflow-scrolling:touch" data-page-node-id="U8GuideList"></div>
      </div>

      <!-- 搜索 -->
      <div class="px-4 pt-4" data-page-node-id="U8SearchSec">
        <div class="flex items-center gap-2 bg-gray-100 rounded-full px-4 py-2.5" data-page-node-id="U8SearchBar">
          <i class="fas fa-magnifying-glass text-gray-400 text-[14px]" data-page-node-id="U8SearchIcon"></i>
          <input type="text" placeholder="搜索商品" class="bg-transparent flex-1 text-[14px] text-gray-700 outline-none placeholder:text-gray-400" data-page-node-id="U8SearchInput">
        </div>
      </div>

      <!-- 筛选栏 -->
      <div class="px-4 pt-4" data-page-node-id="U8FilterSec">
        <div class="flex items-center justify-between" data-page-node-id="U8FilterBar">
          <div class="flex items-center gap-4 overflow-x-auto hide-scrollbar" data-page-node-id="U8FilterLeft">
            <button class="filter-item active text-[14px] font-semibold text-gray-900" data-page-node-id="U8FilterComprehensive">综合</button>
            <button class="filter-item text-[14px] text-gray-500" data-page-node-id="U8FilterSales">销量</button>
            <button class="filter-item text-[14px] text-gray-500 flex items-center gap-0.5" data-page-node-id="U8FilterPrice">价格<i class="fas fa-sort text-[10px]"></i></button>
            <button class="filter-item text-[14px] text-gray-500 flex items-center gap-0.5" data-page-node-id="U8FilterDiscount">优惠力度<i class="fas fa-sort text-[10px]"></i></button>
          </div>
          <button class="flex items-center gap-1 text-[14px] text-gray-500 shrink-0 pl-3" data-page-node-id="U8FilterBtn">
            <i class="fas fa-sliders" data-page-node-id="U8FilterIcon"></i>筛选
          </button>
        </div>
      </div>

      <!-- 商品列表 -->
      <div class="px-4 pt-4 pb-10" data-page-node-id="U8ProductSec">
        <div id="productGrid" class="grid grid-cols-2 gap-3" data-page-node-id="U8Grid"></div>
      </div>

    </div>
  </div>

  <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/75 text-white px-4 py-2 rounded-lg text-[13px] z-[80] hidden" data-page-node-id="U8Toast"></div>

  <style>
    .filter-item{white-space:nowrap;transition:all .2s;background:none;border:none;padding:0}
    .filter-item.active{color:#111;font-weight:600}
    .guide-card{flex:0 0 auto;width:72px;text-align:center;cursor:pointer}
    .guide-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto;border:2px solid #f5f2ec}
    .guide-status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px}
    .guide-status-dot.on{background:#4ade80}
    .guide-status-dot.off{background:#fbbf24}
    .product-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;transition:transform .2s ease}
    .product-card:active{transform:scale(.98)}
  </style>

  <script data-page-node-id="U8Script">
    var GUIDES = [
      { name: '林小婷', img: 'assets/generated/advisor1.png', online: true },
      { name: '陈佳琪', img: 'assets/generated/advisor2.png', online: false },
      { name: '王子墨', img: 'assets/generated/advisor3.png', online: true },
      { name: '苏晚晴', img: 'assets/generated/advisor5.png', online: true },
      { name: '许静文', img: 'assets/generated/advisor6.png', online: true }
    ];
    var PRODUCTS = [
      { name: '【特卖商品】伊菲丹 夜间修护面膜 50ml', label: '离岛免税', tag: '满赠', price: '¥1,280.00', oldPrice: '¥1,680.00', img: 'assets/generated/product_e1.png' },
      { name: '伊菲丹多效焕肤面膜50ml*2', label: '离岛免税', tag: '限量好礼', price: '¥2,560.00', oldPrice: '', img: 'assets/generated/product_e2.png' },
      { name: '伊菲丹 保湿精华水 200ml', label: '离岛免税', tag: '满赠', price: '¥680.00', oldPrice: '', img: 'assets/generated/product_e3.png' },
      { name: '伊菲丹 抗老精华液 30ml', label: '离岛免税', tag: '满赠', price: '¥1,980.00', oldPrice: '¥2,380.00', img: 'assets/generated/product_e4.png' }
    ];

    function esc(s) { return (s || '').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

    function renderGuides() {
      var el = document.getElementById('guideList');
      el.innerHTML = GUIDES.map(function(g, i) {
        return '<div class="guide-card" onclick="openGuide(' + i + ')">' +
          '<div class="relative" style="width:56px;margin:0 auto">' +
            '<img src="' + g.img + '" class="guide-avatar" alt="' + esc(g.name) + '">' +
            '<span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-white guide-status-dot ' + (g.online ? 'on' : 'off') + '"></span>' +
          '</div>' +
          '<p class="text-[11px] font-medium text-gray-700 mt-1.5 truncate">' + esc(g.name) + '</p>' +
          '<p class="text-[9px] text-gray-400 mt-0.5"><span class="guide-status-dot ' + (g.online ? 'on' : 'off') + '"></span>' + (g.online ? '在线' : '稍后回复') + '</p>' +
        '</div>';
      }).join('');
    }

    function renderProducts() {
      var el = document.getElementById('productGrid');
      el.innerHTML = PRODUCTS.map(function(p, i) {
        return '<div class="product-card" onclick="openProduct(' + i + ')" data-page-node-id="U8Prod' + i + '">' +
          '<div class="relative bg-gray-100" style="aspect-ratio:1/1">' +
            '<img src="' + p.img + '" class="w-full h-full object-cover" alt="' + esc(p.name) + '">' +
            (p.tag ? '<span class="absolute bottom-2 right-2 text-[10px] text-white px-1.5 py-0.5 rounded" style="background:#E02E24">' + esc(p.tag) + '</span>' : '') +
          '</div>' +
          '<div class="p-2.5">' +
            '<div class="flex items-center gap-1">' +
              '<span class="text-[10px] text-white px-1 py-0.5 rounded" style="background:#d4a373">' + esc(p.label) + '</span>' +
              '<span class="text-[11px] text-gray-900 leading-tight line-clamp-2 flex-1">' + esc(p.name) + '</span>' +
            '</div>' +
            '<div class="mt-2 flex items-baseline gap-1.5">' +
              '<span class="text-[15px] font-bold text-brand">' + esc(p.price) + '</span>' +
              (p.oldPrice ? '<span class="text-[11px] text-gray-400 line-through">' + esc(p.oldPrice) + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function openGuide(i) {
      var g = GUIDES[i];
      try { localStorage.setItem('currentAdvisor', JSON.stringify({ name: g.name, img: g.img })); } catch (e) {}
      window.location.href = 'U1-用户端IM会话页.html';
    }

    function openProduct(i) {
      showToast('已打开商品：' + PRODUCTS[i].name);
    }

    function showToast(text) {
      var t = document.getElementById('toast');
      if (!t) return;
      t.textContent = text;
      t.classList.remove('hidden');
      setTimeout(function () { t.classList.add('hidden'); }, 1500);
    }

    document.querySelectorAll('.filter-item').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-item').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
    });

    window.addEventListener('DOMContentLoaded', function () {
      renderGuides();
      renderProducts();
    });
  </script>

</body></html>
